
services:
  db:
    image: postgres:13
    restart: always
    container_name: postgres_db
    environment:
      POSTGRES_DB: mydatabase  # Correct environment variable for PostgreSQL
      POSTGRES_USER: myuser     # Correct environment variable for PostgreSQL
      POSTGRES_PASSWORD: mypassword  # Correct environment variable for PostgreSQL
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - new-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    environment:
      DATABASE_ENGINE: postgresql
      DATABASE_NAME: mydatabase
      DATABASE_USER: myuser
      DATABASE_PASSWORD: mypassword
      DATABASE_HOST: db                         # Use the service name "db" instead of "localhost"
      DATABASE_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - new-network

  frontend:
    build:
      context: ./frontend/news-site
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      - "3030:3030"
    volumes:
      - /app/node_modules
    environment:
      REACT_APP_API_URL: http://backend:8000  # Use the service name "backend" instead of "localhost"
    depends_on:
      - backend
    networks:
      - new-network

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: news_scraper
    volumes:
      - .:/app
    environment:
      DATABASE_HOST: db  # Use the service name "db" instead of "localhost"
      DATABASE_NAME: mydatabase
      DATABASE_PORT: 5432
      DATABASE_USER: myuser
      DATABASE_PASSWORD: mypassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - new-network
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"  # Loki runs on port 3100 
    volumes:
     - ./loki-config.yml:/etc/loki/config.yml
    command: -config.file=/etc/loki/config.yml -config.expand-env=true
    networks:
      - new-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro  # Mount Docker logs
      - /var/log:/var/log:ro  # Mount system logs
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    depends_on:
      - loki
    restart: always
    networks:
      - new-network
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml # Corrected config file path                              # Mount system logs
      - /var/run/docker.sock:/var/run/docker.sock       # Mount Docker socket
      - prometheus_data:/prometheus                     #persistent volume
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - loki
    ports:
      - 9090:9090
    networks: 
      - new-network

  node-exporter:
    image: prom/node-exporter
    ports:
      - 9100:9100
    networks:
      - new-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker:/var/lib/docker:ro"
    restart: unless-stopped
    networks:
      - new-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"       # Grafana now runs on port 3000 (host) mapped to 3000 (container)
    depends_on:
      - loki
      - prometheus
      - promtail
    networks:
      - new-network

volumes:
  grafana_data:
  prometheus_data:
  postgres_data:
    driver: local

networks:
  new-network:
    driver: bridge