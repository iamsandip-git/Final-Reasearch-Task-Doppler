
global:
  scrape_interval: 30s 
  scrape_timeout: 25s 
  external_labels:
    monitor: 'Monitoring'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter' 
    static_configs:
      - targets: ['http://35.178.65.136:9100']

  - job_name: 'cAdvisor'
    static_configs:
      - targets: ['http://35.178.65.136:8080/docker/'] 

