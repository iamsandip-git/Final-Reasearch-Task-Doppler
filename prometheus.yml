
global:
  scrape_interval: 30s 
  scrape_timeout: 25s 
  external_labels:
    monitor: 'Monitoring'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['192.168.1.73:9090']

  - job_name: 'node-exporter'
    scrape_timeout: 15s 
    static_configs:
      - targets: ['192.168.1.73:9100']

  - job_name: 'cAdvisor'
    static_configs:
      - targets: ['192.168.1.73:8080'] 

