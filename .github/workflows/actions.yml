name: Deploy to EC2

on:
  push:
    branches: [final-task-doppler]

env:
  EC2_USER: ubuntu
  APP_DIR: /home/ubuntu/app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CLI
        uses: dopplerhq/cli-action@v3
      - name: Do something with the CLI
        run: doppler secrets --only-names
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: |
            ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 to Known Hosts
        run: ssh-keyscan ${{ secrets.EC2_IP }} >> ~/.ssh/known_hosts

      # - name: Test SSH Connection
      #   uses: appleboy/ssh-action@v0.1.10
      #   with:
      #     host: ${{ secrets.EC2_IP }}
      #     username: ${{ env.EC2_USER }}
      #     script: echo "Connection successful!"

      - name: Copy repository to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "."
          target: "${{ env.APP_DIR}}"
          strip_components: 1
          debug: true

      - name: Deploy with Doppler
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{env.EC2_USER}}
          key: ${{secrets.EC2_SSH_PRIVATE_KEY}}
          script: |
            cd ${{ env.APP_DIR }}
            doppler run -- docker compose down 
  
            doppler run -- docker compose up -d 